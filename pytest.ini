[pytest]
testpaths =
    Month-01/Day-17/AI/pdf-rag-chatbot/tests
    Month-01/Day-19/AI/tool-calling-assistant/tests
    Month-01/Day-22/AI/pdf-rag-chatbot/tests
python_files = test_*.py
